<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token Flex Dashboard</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --gold: #f0c000; --silver: #c0c0c0; --bronze: #cd7f32;
    --green: #3fb950; --red: #f85149; --orange: #d29922;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Segoe UI', sans-serif; }

  /* Header */
  .header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 1.2rem 2rem; display: flex; align-items: center; justify-content: space-between;
  }
  .header h1 { font-size: 1.4rem; font-weight: 700; }
  .header h1 span { color: var(--accent); }
  .live-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%;
    display: inline-block; margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .header-right { display: flex; align-items: center; gap: 1rem; font-size: 0.85rem; color: var(--muted); }

  /* Layout */
  .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }

  /* Stat cards */
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.2rem; display: flex; flex-direction: column; gap: 0.3rem;
  }
  .stat-card .label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-card .value { font-size: 1.8rem; font-weight: 700; }
  .stat-card .sub { font-size: 0.8rem; color: var(--muted); }

  /* Main grid */
  .main-grid { display: grid; grid-template-columns: 1fr 340px; gap: 1.5rem; }
  @media (max-width: 860px) { .main-grid { grid-template-columns: 1fr; } }

  /* Ranking table */
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.2rem; overflow: hidden;
  }
  .panel-title { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 0.75rem; color: var(--muted); text-transform: uppercase;
    padding: 0.5rem 0.8rem; border-bottom: 1px solid var(--border); }
  td { padding: 0.7rem 0.8rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(88,166,255,0.04); }

  .rank-medal { font-size: 1.2rem; width: 2rem; text-align: center; }
  .user-id { font-weight: 600; }
  .tokens { font-family: 'SF Mono', 'Consolas', monospace; color: var(--accent); font-weight: 600; }
  .time-ago { color: var(--muted); font-size: 0.8rem; }

  /* Bar chart */
  .bar-chart { display: flex; flex-direction: column; gap: 0.6rem; }
  .bar-row { display: flex; align-items: center; gap: 0.6rem; }
  .bar-label { width: 80px; font-size: 0.82rem; font-weight: 600; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; height: 24px; background: var(--bg); border-radius: 6px; overflow: hidden; position: relative; }
  .bar-fill { height: 100%; border-radius: 6px; transition: width 0.8s ease; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px;
    font-size: 0.72rem; font-weight: 600; color: var(--bg); min-width: fit-content; }
  .bar-fill.r1 { background: linear-gradient(90deg, var(--gold), #ffe066); }
  .bar-fill.r2 { background: linear-gradient(90deg, var(--silver), #e0e0e0); }
  .bar-fill.r3 { background: linear-gradient(90deg, var(--bronze), #e6a860); }
  .bar-fill.rn { background: linear-gradient(90deg, var(--accent), #79c0ff); }

  /* Activity feed */
  .feed { display: flex; flex-direction: column; gap: 0.7rem; max-height: 420px; overflow-y: auto; }
  .feed-item { display: flex; gap: 0.7rem; align-items: flex-start; font-size: 0.85rem; }
  .feed-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 1px; }
  .feed-text { line-height: 1.4; }
  .feed-time { color: var(--muted); font-size: 0.75rem; }

  /* Footer */
  .footer { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.78rem; }
</style>
</head>
<body>

<div class="header">
  <h1><span>Token Flex</span> Dashboard</h1>
  <div class="header-right">
    <span><span class="live-dot"></span>Live</span>
    <span id="last-update">--</span>
  </div>
</div>

<div class="container">
  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <span class="label">Total Players</span>
      <span class="value" id="stat-players">-</span>
    </div>
    <div class="stat-card">
      <span class="label">Total Tokens Burned</span>
      <span class="value" id="stat-total-tokens">-</span>
      <span class="sub" id="stat-total-sub"></span>
    </div>
    <div class="stat-card">
      <span class="label">Today's Leader</span>
      <span class="value" id="stat-leader">-</span>
      <span class="sub" id="stat-leader-sub"></span>
    </div>
    <div class="stat-card">
      <span class="label">Latest Milestone</span>
      <span class="value" id="stat-milestone">-</span>
      <span class="sub" id="stat-milestone-sub"></span>
    </div>
  </div>

  <div class="main-grid">
    <!-- Left: Ranking + Chart -->
    <div>
      <!-- Bar Chart -->
      <div class="panel" style="margin-bottom:1.5rem;">
        <div class="panel-title">Token Usage Race</div>
        <div class="bar-chart" id="bar-chart"></div>
      </div>

      <!-- Ranking Table -->
      <div class="panel">
        <div class="panel-title">Leaderboard</div>
        <table>
          <thead><tr><th style="width:3rem">#</th><th>User</th><th style="text-align:right">Tokens</th><th style="text-align:right">Last Report</th></tr></thead>
          <tbody id="rank-body"></tbody>
        </table>
      </div>
    </div>

    <!-- Right: Activity feed -->
    <div class="panel">
      <div class="panel-title">Activity Feed</div>
      <div class="feed" id="activity-feed">
        <div class="feed-item"><span class="feed-icon">⏳</span><span class="feed-text" style="color:var(--muted)">Waiting for data...</span></div>
      </div>
    </div>
  </div>
</div>

<div class="footer">Token Flex Dashboard &mdash; Anthropic API Token Usage Competition</div>

<script>
const POLL_INTERVAL = 15_000;
const API_BASE = window.location.origin;

function formatTokens(n) {
  if (n >= 1_000_000_000) return (n / 1_000_000_000).toFixed(1) + 'B';
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K';
  return n.toString();
}
function formatTokensFull(n) { return n.toLocaleString(); }

function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

const medals = { 1: '🥇', 2: '🥈', 3: '🥉' };

let prevBoard = [];
let activityItems = [];

function addActivity(icon, text) {
  activityItems.unshift({ icon, text, time: new Date().toISOString() });
  if (activityItems.length > 50) activityItems.length = 50;
  renderFeed();
}

function renderFeed() {
  const el = document.getElementById('activity-feed');
  if (!activityItems.length) return;
  el.innerHTML = activityItems.map(a =>
    `<div class="feed-item"><span class="feed-icon">${a.icon}</span><div><div class="feed-text">${a.text}</div><div class="feed-time">${timeAgo(a.time)}</div></div></div>`
  ).join('');
}

function detectChanges(oldBoard, newBoard) {
  const oldMap = {};
  oldBoard.forEach(e => oldMap[e.user_id] = e);
  for (const entry of newBoard) {
    const old = oldMap[entry.user_id];
    if (!old) {
      addActivity('🆕', `<b>${entry.user_id}</b> joined the race!`);
    } else if (entry.used_tokens > old.used_tokens) {
      const delta = entry.used_tokens - old.used_tokens;
      addActivity('📈', `<b>${entry.user_id}</b> +${formatTokens(delta)} tokens`);
    }
  }
  // Rank changes
  if (newBoard.length && oldBoard.length && newBoard[0].user_id !== oldBoard[0]?.user_id) {
    addActivity('👑', `<b>${newBoard[0].user_id}</b> took the #1 spot!`);
  }
}

async function fetchAndRender() {
  try {
    const [rankRes, statsRes] = await Promise.all([
      fetch(API_BASE + '/rank'),
      fetch(API_BASE + '/stats'),
    ]);
    const rankData = await rankRes.json();
    const statsData = await statsRes.json();
    const board = rankData.board || [];

    // Detect changes
    if (prevBoard.length) detectChanges(prevBoard, board);
    prevBoard = JSON.parse(JSON.stringify(board));

    // Stats
    document.getElementById('stat-players').textContent = statsData.total_users;
    document.getElementById('stat-total-tokens').textContent = formatTokens(statsData.total_tokens);
    document.getElementById('stat-total-sub').textContent = formatTokensFull(statsData.total_tokens) + ' tokens';

    if (statsData.leader) {
      document.getElementById('stat-leader').textContent = statsData.leader.user_id;
      document.getElementById('stat-leader-sub').textContent = formatTokensFull(statsData.leader.used_tokens) + ' tokens';
    }
    if (statsData.latest_milestone) {
      document.getElementById('stat-milestone').textContent = statsData.latest_milestone.user_id;
      document.getElementById('stat-milestone-sub').textContent = formatTokensFull(statsData.latest_milestone.milestone) + ' reached';
    }

    // Table
    const tbody = document.getElementById('rank-body');
    tbody.innerHTML = board.map(e => {
      const medal = medals[e.rank] || e.rank;
      return `<tr>
        <td class="rank-medal">${medal}</td>
        <td class="user-id">${e.user_id}</td>
        <td class="tokens" style="text-align:right">${formatTokensFull(e.used_tokens)}</td>
        <td class="time-ago" style="text-align:right">${timeAgo(e.last_reported_at)}</td>
      </tr>`;
    }).join('');

    // Bar chart
    const maxTokens = board.length ? board[0].used_tokens : 1;
    const chart = document.getElementById('bar-chart');
    chart.innerHTML = board.slice(0, 10).map(e => {
      const pct = Math.max((e.used_tokens / maxTokens) * 100, 3);
      const cls = e.rank <= 3 ? `r${e.rank}` : 'rn';
      return `<div class="bar-row">
        <span class="bar-label">${e.user_id}</span>
        <div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%">${formatTokens(e.used_tokens)}</div></div>
      </div>`;
    }).join('');

    // Update time
    document.getElementById('last-update').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (err) {
    console.error('Fetch error:', err);
  }
}

fetchAndRender();
setInterval(fetchAndRender, POLL_INTERVAL);
</script>
</body>
</html>
